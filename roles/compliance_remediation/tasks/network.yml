
---
# Network security remediation

- name: Enforce global network security parameters
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-ansible-network-security.conf
    sysctl_set: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "0" }
    - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.send_redirects", value: "0" }
    - { name: "net.ipv6.conf.all.forwarding", value: "0" }
    - { name: "net.ipv6.conf.default.forwarding", value: "0" }
    - { name: "net.ipv6.conf.all.accept_redirects", value: "0" }
    - { name: "net.ipv6.conf.default.accept_redirects", value: "0" }

- name: Disable IPv4 ICMP redirect acceptance on every interface
  ansible.builtin.sysctl:
    name: "net.ipv4.conf.{{ item }}.accept_redirects"
    value: "0"
    sysctl_file: /etc/sysctl.d/99-ansible-network-security.conf
    sysctl_set: true
  loop: "{{ ansible_interfaces }}"

- name: Disable IPv4 ICMP redirect sending on every interface
  ansible.builtin.sysctl:
    name: "net.ipv4.conf.{{ item }}.send_redirects"
    value: "0"
    sysctl_file: /etc/sysctl.d/99-ansible-network-security.conf
    sysctl_set: true
  loop: "{{ ansible_interfaces }}"

- name: Disable IPv6 forwarding on every interface
  ansible.builtin.sysctl:
    name: "net.ipv6.conf.{{ item }}.forwarding"
    value: "0"
    sysctl_file: /etc/sysctl.d/99-ansible-network-security.conf
    sysctl_set: true
  loop: "{{ ansible_interfaces }}"

- name: Disable IPv6 ICMP redirect acceptance on every interface
  ansible.builtin.sysctl:
    name: "net.ipv6.conf.{{ item }}.accept_redirects"
    value: "0"
    sysctl_file: /etc/sysctl.d/99-ansible-network-security.conf
    sysctl_set: true
  loop: "{{ ansible_interfaces }}"
